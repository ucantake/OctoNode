name: Release

# Push a tag like `v0.1.0` (matching package.json / tauri.conf.json version),
# or run manually from the Actions tab. Produces a *draft* GitHub Release with:
#   Windows: OctoNode_<ver>_x64-setup.exe (NSIS), .msi, OctoNode_<ver>_x64-portable.exe
#   Linux:   .AppImage, .deb, .rpm
#   macOS:   .dmg for Apple Silicon and Intel
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ""
          - name: linux-x64
            os: ubuntu-22.04
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: OctoNode v__VERSION__
          releaseBody: |
            Windows: run the `-setup.exe` (per-user install, no admin needed) or the `.msi`.
            The `-portable.exe` runs without installing but needs the WebView2 runtime
            (preinstalled on Windows 10/11).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attach portable Windows .exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          cp src-tauri/target/release/octonode.exe "OctoNode_${VERSION}_x64-portable.exe"
          gh release upload "v${VERSION}" "OctoNode_${VERSION}_x64-portable.exe" --clobber
